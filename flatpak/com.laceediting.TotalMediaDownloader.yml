app-id: com.laceediting.TotalMediaDownloader
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: laces-total-media-downloader

finish-args:
  # Display access (X11 + Wayland)
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  # Network access for downloading media
  - --share=network
  # Audio playback for notification sounds
  - --socket=pulseaudio
  # File system access for saving downloads
  - --filesystem=home
  # For xdg-open to open folders after download
  - --talk-name=org.freedesktop.portal.Desktop

# Build options — network access during build for pip
build-options:
  build-args:
    - --share=network

modules:
  # ── SDL2 (required by pygame) ──────────────────────────────────────
  - name: SDL2
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-2.30.10/SDL2-2.30.10.tar.gz
        sha256: f59adf36a8bcdc22d3e9eff02786e107e2e4b248ef093e7e01faa3580e3ae54c

  - name: SDL2_mixer
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.0/SDL2_mixer-2.8.0.tar.gz
        sha256: 09cb2bdab9ee0aaf2ff8e8f4c4e66682bcc0c5ef068044f3dc4ae0ddd20f8ecd

  - name: SDL2_image
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.4/SDL2_image-2.8.4.tar.gz
        sha256: 41a5e40b6c8cdd0b1cdac6425b3c0e0f0dbe0fee720e1b6e6edfe7d4d7de3b17

  # ── Python dependencies (pip install at build time) ────────────────
  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --prefix=/app
          customtkinter
          yt-dlp
          pygame
          requests
          packaging
          Pillow

  # ── The application itself ─────────────────────────────────────────
  - name: laces-total-media-downloader
    buildsystem: simple
    build-commands:
      # Main application
      - install -Dm755 main.py /app/share/laces-total-media-downloader/main.py
      # Assets (icons, fonts, sounds)
      - mkdir -p /app/share/laces-total-media-downloader/assets
      - cp -r assets/* /app/share/laces-total-media-downloader/assets/
      # Desktop entry
      - install -Dm644 flatpak/com.laceediting.TotalMediaDownloader.desktop
          /app/share/applications/com.laceediting.TotalMediaDownloader.desktop
      # AppStream metainfo
      - install -Dm644 flatpak/com.laceediting.TotalMediaDownloader.metainfo.xml
          /app/share/metainfo/com.laceediting.TotalMediaDownloader.metainfo.xml
      # Application icon
      - install -Dm644 assets/icons/icon.png
          /app/share/icons/hicolor/128x128/apps/com.laceediting.TotalMediaDownloader.png
      # Launcher script
      - install -Dm755 flatpak/laces-total-media-downloader
          /app/bin/laces-total-media-downloader
    sources:
      - type: dir
        path: ..
